name: PIKOPIA iOS simulator build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project and build iOS simulator
        run: ./ios-native/scripts/build-simulator.sh
      - name: Verify bundle content
        run: |
          test -f ios-native/.build/Build/Products/Release-iphonesimulator/PIKOPIA.app/www/index.html
          test -f ios-native/.build/Build/Products/Release-iphonesimulator/PIKOPIA.app/www/assets/bgm-pikopia.wav
      - name: Preserve unsigned simulator app for QA (not TestFlight installable)
        uses: actions/upload-artifact@v4
        with:
          name: pikopia-ios-simulator-only
          path: ios-native/.build/Build/Products/Release-iphonesimulator/PIKOPIA.app
          retention-days: 7
