name: PIKOPIA game regression
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pikopia-regression.yml'
      - 'tests/**'
      - 'www/**'
      - 'ios-native/PIKOPIA/www/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run all game regression tests
        run: node --test tests/*.test.cjs
      - name: Check Javascript syntax
        run: |
          for script in www/*.js; do node --check "$script"; done
